windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
	name = music
	match:class = com.github.th_ch.youtube_music
	float = true
	size = 1200 700
}

windowrule {
	name = audio
	match:class = org.pulseaudio.pavucontrol
	float = true
	size = 1200 700
}

windowrule {
	name = bluetooth
	match:class = blueberry.py
	float = true
}
