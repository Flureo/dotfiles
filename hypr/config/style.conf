general {
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    col.active_border = rgba(111111FF)
    col.inactive_border = rgba(00000000)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
	}

    blur {
		enabled = true

	}
}

animations {
	enabled = no
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

